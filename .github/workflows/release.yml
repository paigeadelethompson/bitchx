name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 2.0.0)'
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  # "2.0.0" for a v* tag or a manual dispatch, empty otherwise.
  VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}

jobs:
  linux-deb:
    name: Debian / Ubuntu (.deb + .tar.gz)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Normalize version and pin local release tag
        run: |
          VERSION="${VERSION#v}"
          case "$VERSION" in *[!A-Za-z0-9._-]*) echo "bad version: $VERSION"; exit 1;; esac
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          git tag "bitchx-$VERSION" 2>/dev/null || true
          git describe --match "bitchx-$VERSION" --always --dirty
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libncurses-dev libssl-dev
      - name: Configure
        run: |
          mkdir -p dist
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DBITCHX_SSL=ON \
            -DCPACK_GENERATOR="DEB;TGZ" \
            -DCPACK_OUTPUT_FILE_PREFIX="${PWD}/dist"
      - name: Build
        run: cmake --build build -j"$(nproc)"
      - name: Package (cpack)
        run: cmake --build build --target package
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-linux-deb
          path: dist/

  linux-rpm:
    name: Fedora (.rpm)
    runs-on: fedora-41
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Normalize version and pin local release tag
        run: |
          VERSION="${VERSION#v}"
          case "$VERSION" in *[!A-Za-z0-9._-]*) echo "bad version: $VERSION"; exit 1;; esac
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          git tag "bitchx-$VERSION" 2>/dev/null || true
          git describe --match "bitchx-$VERSION" --always --dirty
      - name: Install dependencies
        run: sudo dnf install -y --setopt=install_weak_deps=False gcc cmake ncurses-devel openssl-devel rpm-build git
      - name: Configure
        run: |
          mkdir -p dist
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DBITCHX_SSL=ON \
            -DCPACK_GENERATOR="RPM" \
            -DCPACK_OUTPUT_FILE_PREFIX="${PWD}/dist"
      - name: Build
        run: cmake --build build -j"$(nproc)"
      - name: Package (cpack)
        run: cmake --build build --target package
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-linux-rpm
          path: dist/

  freebsd:
    name: FreeBSD (.tar.gz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Build and package on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          envs: 'VERSION'
          prepare: |
            pkg install -y git cmake ncurses
          run: |
            set -e
            VERSION="${VERSION#v}"
            case "$VERSION" in *[!A-Za-z0-9._-]*) echo "bad version: $VERSION"; exit 1;; esac
            git tag "bitchx-$VERSION" 2>/dev/null || true
            git describe --match "bitchx-$VERSION" --always --dirty
            mkdir -p dist
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
              -DBITCHX_SSL=ON \
              -DCPACK_GENERATOR="TGZ" \
              -DCPACK_OUTPUT_FILE_PREFIX="${PWD}/dist"
            cmake --build build -j"$(sysctl -n hw.ncpu)"
            cmake --build build --target package
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-freebsd
          path: dist/

  openbsd:
    name: OpenBSD (.tar.gz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Build and package on OpenBSD
        uses: vmactions/openbsd-vm@v1
        with:
          usesh: true
          envs: 'VERSION'
          prepare: |
            pkg_add cmake
          run: |
            set -e
            VERSION="${VERSION#v}"
            case "$VERSION" in *[!A-Za-z0-9._-]*) echo "bad version: $VERSION"; exit 1;; esac
            git tag "bitchx-$VERSION" 2>/dev/null || true
            git describe --match "bitchx-$VERSION" --always --dirty
            mkdir -p dist
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
              -DBITCHX_SSL=ON \
              -DCPACK_GENERATOR="TGZ" \
              -DCPACK_OUTPUT_FILE_PREFIX="${PWD}/dist"
            cmake --build build -j"$(sysctl -n hw.ncpu)"
            cmake --build build --target package
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-openbsd
          path: dist/

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [linux-deb, linux-rpm, freebsd, openbsd]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Normalize version
        run: |
          VERSION="${VERSION#v}"
          case "$VERSION" in *[!A-Za-z0-9._-]*) echo "bad version: $VERSION"; exit 1;; esac
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Create release tag (manual dispatches only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          if ! git rev-parse -q --verify "refs/tags/v${VERSION}"; then
            git tag "v${VERSION}"
            git push origin "v${VERSION}"
          fi
      - name: Collect packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Inspect packages
        run: find dist -type f -exec ls -lh {} +
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: BitchX ${{ env.VERSION }}
          files: dist/**
          generate_release_notes: true